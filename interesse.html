<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anúncio de Interesse — VivaAuto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --navy:#0B1F3A;--n2:#132D4A;--n3:#1A3A5C;
  --green:#00C27C;--blue:#5BB8F5;
  --bg:#f5f7fa;--card:#fff;--border:#dde5f0;
  --text:#0B1F3A;--muted:#6b7fa3;--light:#e8eef8;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#080f1c;--card:#0d1a2e;--border:#1e3550;
  --text:#D0E0ED;--muted:#8BA7C0;--light:#132D4A;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#080f1c;--card:#0d1a2e;--border:#1e3550;
  --text:#D0E0ED;--muted:#8BA7C0;--light:#132D4A;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
nav{background:var(--navy);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{color:#fff;font-weight:900;font-size:20px;text-decoration:none}
.logo span{color:var(--green)}
nav a.back{color:var(--green);font-size:13px;font-weight:600;text-decoration:none}

main{max-width:680px;margin:0 auto;padding:32px 20px 80px}

/* CARD PRINCIPAL */
.top-card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:28px 28px 24px;margin-bottom:16px;
}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.tag-green{background:rgba(0,194,124,.12);color:#00a868;border:1px solid rgba(0,194,124,.2)}
.tag-blue{background:rgba(91,184,245,.12);color:#3a9fd6;border:1px solid rgba(91,184,245,.2)}
.tag-gray{background:var(--light);color:var(--muted)}

.car-title{font-size:clamp(24px,5vw,36px);font-weight:900;line-height:1.15;margin-bottom:6px}
.car-sub{font-size:15px;color:var(--muted);margin-bottom:20px}

.specs-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;margin-bottom:20px;
}
.spec-item{
  background:var(--light);border-radius:10px;padding:12px 14px;
}
.spec-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.spec-value{font-size:15px;font-weight:700;color:var(--text)}

.obs-section{
  background:var(--light);border-radius:10px;padding:14px 16px;margin-bottom:20px;
  font-size:14px;color:var(--text);line-height:1.6;
}
.obs-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}

/* CTA LOJISTA */
.cta-card{
  background:var(--navy);border-radius:16px;padding:28px;
  text-align:center;margin-bottom:16px;
}
.cta-card h2{color:#fff;font-size:22px;font-weight:900;margin-bottom:8px}
.cta-card p{color:#8BA7C0;font-size:14px;margin-bottom:20px;line-height:1.5}
.cta-note{font-size:12px;color:rgba(255,255,255,.4);margin-top:10px}

.btn-wpp{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--green);color:var(--navy);text-decoration:none;
  padding:14px 28px;border-radius:10px;font-weight:900;font-size:15px;
  transition:.15s;
}
.btn-wpp:hover{filter:brightness(1.08)}

/* Botão compartilhar */
.share-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn-share{
  flex:1;min-width:120px;padding:10px;border-radius:9px;
  border:1.5px solid var(--border);background:transparent;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  font-weight:700;cursor:pointer;transition:.15s;
}
.btn-share:hover{border-color:var(--green);color:var(--green)}

#loading{text-align:center;padding:80px 20px;color:var(--muted)}
#not-found{display:none;text-align:center;padding:80px 20px}
#not-found h2{font-size:22px;margin-bottom:8px}
#not-found p{color:var(--muted);margin-bottom:20px}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/"><span>Viva</span>Auto</a>
  <a class="back" href="/vitrine.html">← Vitrine de demandas</a>
</nav>

<main>
  <div id="loading">Carregando anúncio…</div>
  <div id="not-found">
    <h2>Anúncio não encontrado</h2>
    <p>Este link pode ter expirado ou sido removido.</p>
    <a href="/vitrine.html" style="color:var(--green);font-weight:700">Ver todos os anúncios →</a>
  </div>
  <div id="content" style="display:none"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.3/umd/supabase.min.js"></script>
<script>
const SUPA_URL  = 'https://yjwmotnpkwojcazmwgkb.supabase.co';
const SUPA_ANON = 'sb_publishable_0coKU-DYdEcbHa6NPkUqag_vp_UOvuu';
// WhatsApp do VivaAuto para mediar contato
const VIVA_WPP  = '5511999999999';

const supa = supabase.createClient(SUPA_URL, SUPA_ANON);

const prazoLabel={imediato:'Compra imediata','1_mes':'Até 1 mês','3_meses':'Até 3 meses',sem_pressa:'Sem pressa'};
const finLabel={sim:'Aceita financiamento',nao:'Somente à vista',indiferente:'Indiferente'};
function fmt(n){return n?'R$ '+Number(n).toLocaleString('pt-BR'):null}
function fmtKm(n){return n?Number(n).toLocaleString('pt-BR')+' km':null}
function fmtAnos(min,max){
  if(min&&max)return min===max?String(min):`${min} a ${max}`;
  if(min)return `${min} ou mais novo`;
  if(max)return `até ${max}`;
  return 'Qualquer ano';
}
function timeAgo(ts){
  const d=Math.floor((Date.now()-new Date(ts))/86400000);
  if(d===0)return 'hoje';if(d===1)return 'ontem';return `há ${d} dias`;
}

(async()=>{
  const slug = new URLSearchParams(location.search).get('s');
  if(!slug){showNotFound();return;}

  const {data,error} = await supa
    .from('vitrine_publica')
    .select('*')
    .eq('slug',slug)
    .single();

  document.getElementById('loading').style.display='none';

  if(error||!data){showNotFound();return;}

  // Atualiza <title>
  document.title=`${data.marca} ${data.modelo} em ${data.cidade}/${data.estado} — VivaAuto`;

  const specs=[
    {l:'Ano',v:fmtAnos(data.ano_min,data.ano_max)},
    {l:'KM máximo',v:fmtKm(data.km_max)||'Sem restrição'},
    {l:'Orçamento',v:fmt(data.orcamento_max)||'Não informado'},
    {l:'Cor',v:data.cor||'Qualquer'},
    {l:'Pagamento',v:finLabel[data.financiamento]},
    {l:'Prazo',v:prazoLabel[data.prazo]},
  ];

  const wppMsg = encodeURIComponent(
    `Olá VivaAuto! Tenho interesse no anúncio ${data.marca} ${data.modelo} em ${data.cidade}/${data.estado}. Link: ${location.href}`
  );

  const html=`
  <div class="top-card">
    <div class="tag-row">
      <span class="tag tag-green">${prazoLabel[data.prazo]}</span>
      <span class="tag tag-blue">📍 ${data.cidade} — ${data.estado}</span>
      <span class="tag tag-gray">Publicado ${timeAgo(data.created_at)}</span>
    </div>
    <div class="car-title">${data.marca} ${data.modelo}</div>
    <div class="car-sub">Anúncio de interesse de compra</div>
    <div class="specs-grid">
      ${specs.map(s=>`
        <div class="spec-item">
          <div class="spec-label">${s.l}</div>
          <div class="spec-value">${s.v}</div>
        </div>`).join('')}
    </div>
    ${data.observacoes?`
    <div class="obs-section">
      <div class="obs-label">Observações do comprador</div>
      ${data.observacoes}
    </div>`:''}
    <div class="share-row">
      <button class="btn-share" onclick="copyLink()">📋 Copiar link</button>
      <button class="btn-share" onclick="shareWpp()">💬 Compartilhar no WhatsApp</button>
    </div>
  </div>

  <div class="cta-card">
    <h2>Você tem este carro?</h2>
    <p>Entre em contato com a VivaAuto. Vamos apresentar sua oferta para este comprador e intermediar a negociação.</p>
    <a class="btn-wpp" href="https://wa.me/${VIVA_WPP}?text=${wppMsg}" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Tenho este carro — entrar em contato
    </a>
    <p class="cta-note">Mediado pela VivaAuto. Seu contato vai diretamente para o comprador.</p>
  </div>`;

  document.getElementById('content').innerHTML=html;
  document.getElementById('content').style.display='block';
})();

function showNotFound(){
  document.getElementById('loading').style.display='none';
  document.getElementById('not-found').style.display='block';
}

function copyLink(){
  navigator.clipboard.writeText(location.href).catch(()=>{});
  event.target.textContent='✓ Copiado!';
  setTimeout(()=>event.target.textContent='📋 Copiar link',2000);
}
function shareWpp(){
  const msg=encodeURIComponent('Olha esse anúncio de compra de carro no VivaAuto: '+location.href);
  window.open('https://wa.me/?text='+msg,'_blank');
}
</script>
</body>
</html>
